<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Build a simple fitness routine with personalized workouts, progress tracking, and easy meal ideas."
    />
    <link rel="canonical" href="https://fitlife-web-app.vercel.app/" />
    <meta property="og:title" content="FitLife — Workouts, Progress &amp; Simple Nutrition" />
    <meta
      property="og:description"
      content="Build a simple fitness routine with personalized workouts, progress tracking, and easy meal ideas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitLife" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://fitlife-web-app.vercel.app/" />
    <meta
      property="og:image"
      content="https://fitlife-web-app.vercel.app/branding/fitlife-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="FitLife mobile app showing the Home, guided workout, and Progress screens"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FitLife — Workouts, Progress &amp; Simple Nutrition"
    />
    <meta
      name="twitter:description"
      content="Build a simple fitness routine with personalized workouts, progress tracking, and easy meal ideas."
    />
    <meta
      name="twitter:image"
      content="https://fitlife-web-app.vercel.app/branding/fitlife-preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="FitLife mobile app showing the Home, guided workout, and Progress screens"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const savedTheme = localStorage.getItem('fitlife-theme')
        const theme = savedTheme === 'light' ? 'light' : 'dark'
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f7f9fa' : '#0b0f14'
      } catch {
        document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = 'dark'
      }
    </script>
    <title>FitLife — Workouts, Progress &amp; Simple Nutrition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

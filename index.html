<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <meta
      name="description"
      content="Build a simple fitness routine with personalized workouts, progress tracking, and easy meal ideas."
    />
    <meta property="og:title" content="FitLife — Workouts, Progress &amp; Simple Nutrition" />
    <meta
      property="og:description"
      content="Build a simple fitness routine with personalized workouts, progress tracking, and easy meal ideas."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const savedTheme = localStorage.getItem('fitlife-theme')
        const theme = savedTheme === 'light' ? 'light' : 'dark'
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f7f9fa' : '#0b0f14'
      } catch {
        document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = 'dark'
      }
    </script>
    <title>FitLife — Workouts, Progress &amp; Simple Nutrition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
